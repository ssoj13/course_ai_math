name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows running the deployment manually from the Actions tab.
  workflow_dispatch:

# Least privilege: the test and build jobs only clone the repo. pages/id-token write is granted
# to the deploy job alone.
permissions:
  contents: read

# One Pages deployment at a time; a newer push supersedes a queued one but never
# cancels a deployment that is already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

# Actions are pinned by full commit SHA (a tag can be moved to other code); the comment names the
# release. Same pins as the vllm course.
# Runner image pinned: ubuntu-latest moves to 26.04 on 2026-10-19; move deliberately after a green trial run.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # bun 1.4.3 is required: 1.3.12 crashes loading react-dom/server during Astro's prerender.
          bun-version: 1.4.3
      - name: Install site dependencies
        run: bun install --frozen-lockfile
      - name: JS tests
        run: bun test tests/js
      - name: Type check
        run: bun run check
      # Bundle budgets (Ruling O, scripts/size-report.ts) need a build of their own: the deploy build runs in its own job.
      # Warn only: an over-budget chunk shows as a warning annotation and must not block publishing.
      - name: Bundle budgets
        run: bun run build && bun run size
        continue-on-error: true

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, build and upload the site
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          package-manager: bun@1.4.3

  deploy:
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
