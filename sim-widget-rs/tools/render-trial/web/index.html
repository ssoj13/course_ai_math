<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Compiled renderer — public BSDF portable trial</title><style>
:root{font:11px/1.45 "Segoe UI",system-ui,sans-serif;color:#edf1f6;background:#20242b}body{margin:0;padding:8px}.topbar{height:36px;display:flex;align-items:center;gap:8px}h1{font-size:14px;margin:0}button{font:inherit;height:26px;padding:0 8px;border:1px solid #a6b8d0;border-radius:5px;background:#303641;color:inherit}button:focus-visible{outline:2px solid #b9d2ff;outline-offset:2px}.card{max-width:900px;border:1px solid #454f5d;background:#272c34}.header{height:28px;display:flex;align-items:center;padding:0 8px;gap:8px}canvas{display:block;width:100%;height:auto;aspect-ratio:2;background:#20262e}.legend{display:flex;justify-content:space-around;height:28px;align-items:center}pre{font:11px/1.45 Consolas,monospace;white-space:pre-wrap;padding:8px;margin:0;background:#1e232a}#status{padding:8px} @media(any-pointer:coarse){button{min-height:44px}.header{height:auto;min-height:44px}}
</style><body><header class="topbar"><h1>Compiled renderer</h1><span>Real GPU fill and triangle-edge ribbons · public Standard Surface</span></header><main class="card"><div class="header"><strong>Portable lit pixel parity</strong><button id="run">Run actual GPU trial</button><button id="copy">Copy evidence</button></div><canvas id="view" aria-label="Five material swatches rendered by the compiled Rust GPU encoder"></canvas><div class="legend"><span>Diffuse</span><span>Plastic</span><span>Metal</span><span>Coat</span><span>Emission</span></div><div id="status" role="status">Ready to initialize the compiled renderer.</div><pre id="report"></pre></main><script type="module">
import init,{run_portable} from "./pkg/sim_render_trial.js";
const run=document.getElementById("run"),status=document.getElementById("status"),report=document.getElementById("report");
run.addEventListener("click",async()=>{run.disabled=true;status.textContent="Loading WASM and requesting WebGPU…";const start=performance.now();try{await init();const data=JSON.parse(await run_portable(document.getElementById("view")));data.wallMilliseconds=performance.now()-start;data.browser=navigator.userAgent;data.cssViewport=[innerWidth,innerHeight];data.dpr=devicePixelRatio;data.timestamp=new Date().toISOString();window.rendererEvidence=data;report.textContent=JSON.stringify(data,null,2);status.textContent=data.passed?"Executed GPU pixel assertions passed.":"GPU assertions failed; inspect evidence.";document.body.dataset.result=data.passed?"passed":"failed";}catch(error){status.textContent=String(error);report.textContent=JSON.stringify({passed:false,error:String(error)});document.body.dataset.result="failed";}finally{run.disabled=false;}});
document.getElementById("copy").addEventListener("click",async()=>{await navigator.clipboard.writeText(report.textContent);});
</script></body></html>
