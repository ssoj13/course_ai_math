[package]
name = "sim-render-trial"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
[workspace]
[[bin]]
name = "sim-render-native-trial"
path = "src/main.rs"
[lib]
crate-type = ["cdylib","rlib"]
[dependencies]
sim-render = { path = "../../crates/sim-render" }
sim-runtime = { path = "../../crates/sim-runtime" }
sim-math = { path = "../../crates/sim-math" }
sim-model = { path = "../../crates/sim-model" }
serde = {version="1",features=["derive"]}
serde_json = "1"
glam = "0.32"
futures-channel = "0.3"
standard-surface-bsdf = { path = "../../vendor/render-rs/crates/render-engine-pt/standard-surface-bsdf" }
sim-editor-ui = { path = "../../crates/sim-editor-ui" }
egui = "=0.36.2"
egui-wgpu = "=0.36.2"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = {version="=30.0.1",default-features=false,features=["std","wgsl","dx12","vulkan"]}
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = {version="=30.0.1",default-features=false,features=["std","wgsl","vulkan"]}
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = {version="=30.0.1",default-features=false,features=["std","wgsl","metal"]}
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = {version="=30.0.1",default-features=false,features=["std","wgsl","webgpu","fragile-send-sync-non-atomic-wasm"]}
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-sys = {version="0.3",features=["HtmlCanvasElement","Window","Document"]}
console_error_panic_hook = "0.1"
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
