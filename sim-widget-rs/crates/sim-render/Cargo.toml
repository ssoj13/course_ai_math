[package]
name = "sim-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sim-model.workspace = true
sim-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror = "2"
bytemuck = { version = "1.24", features = ["derive"] }
glam = { version = "0.32", features = ["serde"] }
standard-surface-bsdf = { path = "../../vendor/render-rs/crates/render-engine-pt/standard-surface-bsdf" }

[dev-dependencies]
sim-math.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
naga = { version = "=30.0.0", features = ["wgsl-in"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "metal"] }
