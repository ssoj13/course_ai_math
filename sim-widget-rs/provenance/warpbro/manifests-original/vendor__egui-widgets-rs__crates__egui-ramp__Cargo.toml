# egui-ramp — a reusable generic ramp / curve + gradient editor for egui.
#
# Two hermetic, caller-owned editors in the spirit of a Houdini ramp, a Nuke LUT,
# or Maya's `remapValue`:
#   * a value-remap CURVE — draggable keys with per-side tangents (a `curves::Track`)
#     over a [0,1]×[0,1] box, with an `eval(x) -> y` lookup;
#   * a colour GRADIENT / ramp — draggable colour stops under a painted ramp bar,
#     with a `sample(t) -> Color32` lookup (linear-space lerp between stops).
#
# Fully GENERIC — no application types. The caller owns the `Track` / `Gradient`
# data; the widgets MUTATE the borrowed value in place (immediate-mode contract)
# and return an `egui::Response` whose `.changed()` reports edits. Transient
# interaction state (the selected gradient stop) lives in egui memory, keyed by
# the widget id — the widgets own no cross-frame state of their own.
#
# The selected stop's colour is edited with the shared `egui-colorpicker` widget
# (the same Maya/Nuke-style picker every other colour swatch in this workspace
# uses), not egui's bare `color_edit_button_srgba`.

[package]
name = "egui-ramp"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A reusable generic egui ramp editor — value-remap curve + colour gradient (Houdini ramp / Nuke LUT / Maya remapValue)"

[lib]
path = "src/egui_ramp.rs"

[dependencies]
egui = { workspace = true }
# The track maths (keys, tangents, eval) live in the standalone `curves` crate so
# they stay UI-agnostic and reusable. Consumed via ssh git-ref (private repo)
# so egui-ramp stays buildable when pulled as a git dependency.
curves = { git = "ssh://git@github.com/ssoj13/curves-rs.git", branch = "main" }
# Shared widget metrics (stroke widths), the attribute rows' `AttrMetrics`, the segmented strip
# and the icon button, so the ramp's strokes resolve from the
# same token source as the other widgets, instead of hard-coded literals.
egui-widgets-config = { path = "../egui-widgets-config" }
egui-colorpicker = { path = "../egui-colorpicker" }

[dev-dependencies]
# `wgpu` + `snapshot` only for the `--ignored` screenshot test (WIDGET_SHOTS=dir).
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
