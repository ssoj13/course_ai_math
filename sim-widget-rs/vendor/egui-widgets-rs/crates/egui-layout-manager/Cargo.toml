# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-layout-manager"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Named dock-layout save/restore widget for egui — combo + Save/Restore/Delete/Rename over an opaque String blob, no egui_dock dependency"

[lib]
path = "src/egui_layout_manager.rs"

[dependencies.egui]
version = "0.36"

[dependencies.egui-widgets-config]
path = "../egui-widgets-config"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.indexmap]
version = "2"
features = ["serde"]

[dev-dependencies]
serde_json = "1"
