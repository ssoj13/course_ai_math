# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-viewport-toolbar"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Generic collapsible viewport toolbar strip for egui: rolls up to the left into a button"

[lib]
path = "src/egui_viewport_toolbar.rs"

[dependencies.egui]
version = "0.36"

[dependencies.egui-widgets-config]
path = "../egui-widgets-config"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.egui-display]
path = "../egui-display"

[dependencies.egui-colorpicker]
path = "../egui-colorpicker"

[dev-dependencies]
serde_json = "1"
egui_kittest = "0.36"
