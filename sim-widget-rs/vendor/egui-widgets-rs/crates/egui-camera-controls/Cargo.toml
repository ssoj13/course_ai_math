# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-camera-controls"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Map egui viewport input to host-agnostic camera intents (orbit / pan / dolly / fly)"

[lib]
path = "src/egui_camera_controls.rs"

[dependencies.egui]
version = "0.36"

[dependencies.serde]
version = "1"
features = ["derive"]
