# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-arbor"
authors = ["kyjohnso", "Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Blender-style hierarchical tree/outliner for egui (trait-based nodes, drag-drop, action icons)"

[lib]
path = "src/egui_arbor.rs"

[features]
default = []
serde = ["dep:serde"]

[dependencies.egui-widgets-config]
path = "../egui-widgets-config"

[dependencies.egui]
version = "0.36"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true
