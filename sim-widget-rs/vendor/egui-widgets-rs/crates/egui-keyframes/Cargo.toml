# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-keyframes"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "A reusable generic egui keyframe / animation-curve panel — properties, keyframe tracks, playhead"

[lib]
path = "src/egui_keyframes.rs"

[dependencies.egui]
version = "0.36"

[dependencies.egui-slider]
path = "../egui-slider"

[dependencies.egui-widgets-config]
path = "../egui-widgets-config"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[features]
default = ["serde"]
serde = ["dep:serde"]
