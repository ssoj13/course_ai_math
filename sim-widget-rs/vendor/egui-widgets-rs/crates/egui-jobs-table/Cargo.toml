# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-jobs-table"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "A generic, sortable/filterable egui table for async jobs with status badges, progress bars, and per-row actions"

[lib]
path = "src/egui_jobs_table.rs"

[dependencies.egui]
version = "0.36"

[dependencies.egui-widgets-config]
path = "../egui-widgets-config"

[dependencies.egui_extras]
version = "0.36"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[features]
default = []
serde = ["dep:serde"]
