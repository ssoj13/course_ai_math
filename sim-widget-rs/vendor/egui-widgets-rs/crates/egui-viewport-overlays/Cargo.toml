# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-viewport-overlays"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Generic 3-D viewport overlays for egui: axes, bbox/frustum wireframes, ground grid, camera mask + reticles"

[lib]
path = "src/egui_viewport_overlays.rs"

[dependencies.egui]
version = "0.36"

[dependencies.egui-widgets-config]
path = "../egui-widgets-config"

[dependencies.egui-gizmo]
path = "../egui-gizmo"

[dependencies.glam]
version = "0.33"

[dependencies.serde]
version = "1"
features = ["derive"]
