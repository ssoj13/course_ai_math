# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-gpu-view"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Display an offscreen wgpu texture in egui (no CPU readback) + viewport pointer helpers"

[lib]
path = "src/egui_gpu_view.rs"

[dependencies.egui]
version = "0.36"

[dependencies.egui-wgpu]
version = "0.36"

[dependencies.wgpu]
version = "30"
