# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-widgets-config"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Shared design tokens (fonts, metrics, semantic colours) + runtime config for the egui-widgets-rs widget set"

[lib]
path = "src/egui_widgets_config.rs"

[dependencies.egui]
version = "0.36"

[dependencies.egui-phosphor]
path = "../../../egui-phosphor"

[dependencies.serde]
version = "1"
features = ["derive"]

[dev-dependencies]
serde_json = "1"
egui_kittest = "0.36"
