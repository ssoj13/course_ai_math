# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-display"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Float egui canvas and explicit SDR/HDR window output"

[dependencies]
log = "0.4"
tempfile = "3"

[dependencies.egui]
version = "0.36"

[dependencies.wgpu]
version = "30"

[dependencies.egui-wgpu]
version = "0.36"

[dependencies.bytemuck]
version = "1"
features = ["derive"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.gpu-mem]
package = "gpu-info-rs"
default-features = false
features = ["wgpu"]
path = "../../../gpu-info-rs"

[dependencies.png]
version = "0.18"

[dependencies.half]
version = "2"
features = ["bytemuck"]

[dependencies.thiserror]
version = "2"

[dependencies.egui-widgets-config]
path = "../egui-widgets-config"

[dev-dependencies]
pollster = "1.0"

[dev-dependencies.naga]
version = "30"
features = ["wgsl-in"]

[dev-dependencies.vfx-ocio]
path = "../../../oiio-rs/crates/ocio/vfx-ocio"

[dev-dependencies.half]
version = "2"
features = ["bytemuck"]
