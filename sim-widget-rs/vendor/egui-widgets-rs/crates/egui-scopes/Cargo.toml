# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-scopes"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "GPU video scopes (histogram / waveform / vectorscope) for egui, scattering from a wgpu texture"

[lib]
path = "src/egui_scopes.rs"

[dependencies.egui]
version = "0.36"

[dependencies.egui-wgpu]
version = "0.36"

[dependencies.wgpu]
version = "30"

[dependencies.bytemuck]
version = "1"
features = ["derive"]

[dev-dependencies.naga]
version = "30"
features = ["wgsl-in"]
