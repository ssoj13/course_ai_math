# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-logbuffer"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ssoj13/egui-widgets-rs"
rust-version = "1.96"
description = "Thread-safe log ring buffer with a tracing layer and a colourised egui log panel"

[lib]
path = "src/egui_logbuffer.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = "0.3"

[dependencies.egui]
version = "0.36"

[dependencies.egui-widgets-config]
path = "../egui-widgets-config"
