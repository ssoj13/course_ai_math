# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "gpu-info-rs"
version = "0.1.0"
edition = "2024"
description = "Portable GPU info: wgpu capability reporting (limits/features/formats) + DXGI VRAM budget, plus OS-level VRAM/RAM query (no GPU context). One-stop GPU info crate with a diagnostic CLI."
license = "MIT OR Apache-2.0"

[lib]
name = "gpu_info"
path = "src/lib.rs"

[[bin]]
name = "gpu-info"
path = "src/bin/wgpu-info.rs"
required-features = ["cli"]

[[example]]
name = "unload_probe_dll"
crate-type = ["cdylib"]
required-features = ["wgpu"]

[[example]]
name = "unload_probe"

[features]
default = ["cli", "wgpu"]
cli = ["dep:clap", "wgpu"]
wgpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
serde_json = "1"
log = "0.4"
bytemuck = "1"
thiserror = "2"

[dependencies.wgpu]
version = "30"
features = ["serde"]
optional = true

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.pollster]
version = "0.4"
optional = true

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[dependencies.half]
version = "2"
features = ["bytemuck"]

[target."cfg(windows)".dependencies.windows]
version = "0.62"
features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Performance", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_UI_ColorSystem"]

[target."cfg(any(windows, target_os = \"linux\", target_os = \"android\", target_os = \"freebsd\"))".dependencies.ash]
version = "0.38"
default-features = false
features = ["std", "loaded"]

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.4"

[target."cfg(target_os = \"macos\")".dependencies.objc2-metal]
version = "0.3.2"
features = ["MTLDevice"]
