# Normalized immutable owned copy. Original bytes and dispositions: provenance/warpbro/manifests-original and patches.
[package]
name = "egui-file-dialog"
description = "easy-to-use and customizable file dialog for egui"
version = "0.15.0"
edition = "2021"
authors = ["Jannis Teipel <jannistpl@gmail.com>"]
repository = "https://github.com/jannistpl/egui-file-dialog"
homepage = "https://github.com/jannistpl/egui-file-dialog"
readme = "README.md"
license = "MIT"
exclude = ["media/", "!media/readme/", ".github/"]

[dependencies]
directories = "6.0"
dunce = "1.0.5"

[dependencies.egui]
version = "0.36.0"
default-features = false

[dependencies.sysinfo]
version = "0.39"
default-features = false
features = ["disk"]

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.indexmap]
version = "2.7.0"
features = ["serde"]
optional = true

[dependencies.image-meta]
version = "0.1.2"
optional = true

[dependencies.chrono]
version = "0.4.39"
optional = true

[dev-dependencies]
tempdir = "0.3"

[dev-dependencies.eframe]
version = "0.36.0"
default-features = false
features = ["glow", "persistence", "wayland", "x11"]

[dev-dependencies.egui-file-dialog]
path = ""
features = ["information_view"]

[dev-dependencies.egui_extras]
version = "0.36"
features = ["all_loaders"]

[dev-dependencies.image]
version = "0.25.5"
features = ["bmp", "jpeg", "gif", "png", "tiff", "rayon"]

[features]
default = ["serde", "default_fonts"]
serde = ["dep:serde"]
default_fonts = ["egui/default_fonts"]
information_view = ["dep:chrono", "image-meta", "indexmap"]

[lints.rust]
unsafe_code = "warn"

[lints.clippy.nursery]
level = "deny"
priority = 0

[lints.clippy.pedantic]
level = "deny"
priority = 1

[lints.clippy.enum_glob_use]
level = "deny"
priority = 2

[lints.clippy.perf]
level = "warn"
priority = 3

[lints.clippy.style]
level = "warn"
priority = 4

[lints.clippy.unwrap_used]
level = "deny"
priority = 5

[lints.clippy.expect_used]
level = "deny"
priority = 6

[lints.clippy.struct_excessive_bools]
level = "allow"
priority = 10

[lints.clippy.return_self_not_must_use]
level = "allow"
priority = 11

[lints.clippy.must_use_candidate]
level = "allow"
priority = 12

[lints.clippy.struct_field_names]
level = "allow"
priority = 13

[lints.clippy.missing_fields_in_debug]
level = "allow"
priority = 14

[lints.clippy.missing_errors_doc]
level = "allow"
priority = 15

[lints.clippy.module_name_repetitions]
level = "allow"
priority = 16

[lints.clippy.cast_precision_loss]
level = "allow"
priority = 17

[lints.clippy.missing_const_for_fn]
level = "allow"
priority = 18
